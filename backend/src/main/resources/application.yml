spring:
  application:
    name: service-atlas

  # ADR-002: embedded H2 in file mode by default — no database to install before the first scan.
  datasource:
    url: jdbc:h2:file:${service-atlas.data-dir}/atlas;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver

  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema; Hibernate may only check it (ADR-002).
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  mvc:
    problemdetails:
      enabled: true

  threads:
    virtual:
      enabled: false

server:
  port: 8080
  compression:
    enabled: true
    mime-types: application/json,text/event-stream,text/html,text/css,application/javascript,image/svg+xml
  error:
    include-message: never
    include-stacktrace: never

service-atlas:
  data-dir: ${user.home}/.service-atlas
  scan:
    max-depth: 3
    ignored-directories:
      - .git
      - target
      - node_modules
      - .idea
      - .bloop
      - .metals
      - build
      - out
      - .gradle
    max-files-per-repo: 5000
    max-file-size-bytes: 2097152
  lucid:
    # FR-6.2 / Q-3: the REST API export stays off until real credentials arrive from the
    # environment. The .lucid file download (FR-6.1) never needs any of this.
    enabled: ${LUCID_API_ENABLED:false}
    client-id: ${LUCID_CLIENT_ID:}
    client-secret: ${LUCID_CLIENT_SECRET:}
    base-url: ${LUCID_API_BASE_URL:https://api.lucid.co}
    redirect-uri: ${LUCID_REDIRECT_URI:http://localhost:8080/api/v1/lucid/oauth/callback}
    token-encryption-key: ${LUCID_TOKEN_KEY:}

logging:
  level:
    com.serviceatlas: INFO
    org.hibernate.orm.deprecation: ERROR

---
# PostgreSQL profile (ADR-002): same Flyway migrations, different engine.
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/service_atlas}
    username: ${SPRING_DATASOURCE_USERNAME:service_atlas}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: org.postgresql.Driver
