services {
  tariffs {
    url = "http://log-tariff-svc:8080/tariffs"
  }
}

# The common real-world shape: the URL is assembled from the environment, so HOCON resolves it to
# "jdbc:postgresql://:5432/". The engine is certain; the database name is not (FR-3.9).
db.default {
  driver = "org.postgresql.Driver"
  url = "jdbc:postgresql://"${?PRICING_DB_HOST}":5432/"${?PRICING_DB_NAME}
}
