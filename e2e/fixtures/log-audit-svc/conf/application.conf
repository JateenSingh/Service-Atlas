kafka {
  topics {
    consume = "order-events"
  }
}


pubsub {
  project-id = "acme-logistics"
  order-events {
    topic = "order-events-v2"
    subscription = "order-events-audit-sub"
  }
}

bigquery {
  url = "jdbc:bigquery://https://www.googleapis.com/bigquery/v2:443;ProjectId=acme-logistics;DatasetId=audit"
}
