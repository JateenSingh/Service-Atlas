services {
  pricing {
    url = "http://log-pricing-svc:8080"
  }
}

kafka {
  bootstrap.servers = "kafka-broker:9092"
  topics {
    consume = "order-events"
  }
}


mongodb {
  uri = "mongodb://inventory-db.logistics:27017/inventory"
}

pubsub {
  project-id = "acme-logistics"
  order-events {
    topic = "order-events-v2"
    subscription = "order-events-inventory-sub"
  }
}
