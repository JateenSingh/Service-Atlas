akka.http.server.request-timeout = 20s

kafka {
  topics {
    consume = "order-events"
  }
}

services {
  templates {
    url = "http://log-template-svc:9000"
  }
}

# A database named by a key rather than by a URL.
mongodb {
  database = "notifications"
}

# Pub/Sub without a "pubsub" anywhere in the key path: the resource path identifies itself.
messaging {
  template-renders {
    topic = "projects/acme-logistics/topics/template-renders"
  }
}
