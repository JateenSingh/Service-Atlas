play.http.secret.key = "changeme"
play.modules.enabled += "modules.ClientModule"

services {
  # Internal HTTP dependencies (FR-3.2 signals)
  inventory {
    url = "http://log-inventory-svc:9000"
    url = ${?INVENTORY_URL}
    timeout = 5 seconds
  }
  shipment {
    base-url = "http://log-shipment-svc.logistics.svc.cluster.local:9000/shipments"
  }
  tracking {
    host = "log-tracking-svc"
    port = 9000
  }
  # Third-party API: becomes an EXTERNAL node
  payments {
    url = "https://api.stripe.com/v1/charges"
  }
  # Not a dependency: our own bind address
  self {
    url = "http://localhost:9000"
  }
}

kafka {
  bootstrap.servers = "kafka-broker:9092"
  producer {
    topic = "order-events"
  }
  consumer {
    topic = "payment-confirmations"
    group-id = "log-order-svc"
  }
}


# Datastore (FR-3.9): the orders database this service owns.
db.default {
  driver = "org.postgresql.Driver"
  url = "jdbc:postgresql://orders-db.logistics:5432/orders"
  url = ${?ORDERS_DB_URL}
  username = "orders"
}

# Read-through cache, shared with log-quote-svc.
redis {
  url = "redis://pricing-cache.logistics:6379/0"
}

# Google Pub/Sub (FR-3.10).
pubsub {
  project-id = "acme-logistics"
  order-events {
    topic = "projects/acme-logistics/topics/order-events-v2"
  }
  payment-updates {
    topic = "payment-updates"
    subscription = "payment-updates-orders-sub"
  }
}
